<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Master Shadow -->
    <filter id="droidShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.30" />
    </filter>

    <filter id="topWeaveShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="droidBgGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#141C2B" />
      <stop offset="50%" stop-color="#0D131E" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <radialGradient id="droidEmeraldAura" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3DDC84" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#3DDC84" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#3DDC84" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="droidCyanAura" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#007AFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="droidGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AF2A5" />
      <stop offset="50%" stop-color="#3DDC84" />
      <stop offset="100%" stop-color="#00C48C" />
    </linearGradient>

    <linearGradient id="droidBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38B6FF" />
      <stop offset="50%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#5856D6" />
    </linearGradient>

    <linearGradient id="droidGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="droidSpark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <!-- Clip Paths -->
    <clipPath id="androidSquircleClip">
      <rect x="32" y="32" width="448" height="448" rx="100" ry="100" />
    </clipPath>

    <clipPath id="topWeaveClip">
      <rect x="420" y="320" width="184" height="180" />
    </clipPath>
  </defs>

  <!-- Outer Squircle Container -->
  <g clip-path="url(#androidSquircleClip)">
    <!-- Background Surface -->
    <rect x="0" y="0" width="512" height="512" fill="url(#droidBgGrad)" />
    <!-- Dynamic Auras -->
    <rect x="0" y="0" width="512" height="512" fill="url(#droidEmeraldAura)" />
    <rect x="0" y="0" width="512" height="512" fill="url(#droidCyanAura)" />

    <!-- Subtle Tech Circuit Lines -->
    <g opacity="0.06" stroke="#FFFFFF" stroke-width="1.2">
      <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="6 8" />
      <circle cx="256" cy="256" r="215" fill="none" />
    </g>

    <!-- DEAD-CENTERED GLYPH (Optical center translated to 256, 256) -->
    <g filter="url(#droidShadow)" transform="translate(256 256) scale(0.50) translate(-512 -490)">
      
      <!-- Android Antennas -->
      <g stroke="url(#droidGreenGrad)" stroke-width="18" stroke-linecap="round">
        <line x1="335" y1="385" x2="280" y2="310" />
        <line x1="405" y1="340" x2="385" y2="255" />
      </g>
      <circle cx="277" cy="306" r="10" fill="#5AF2A5" />
      <circle cx="384" cy="251" r="10" fill="#5AF2A5" />

      <!-- Apple Link Loop -->
      <rect x="430" y="440" width="300" height="150" rx="75" ry="75" 
            transform="rotate(-35 580 515)" 
            fill="none" 
            stroke="url(#droidBlueGrad)" 
            stroke-width="50" 
            stroke-linejoin="round" />
      <rect x="430" y="440" width="300" height="150" rx="75" ry="75" 
            transform="rotate(-35 580 515)" 
            fill="none" 
            stroke="url(#droidGleam)" 
            stroke-width="10" 
            opacity="0.45" />

      <!-- Android Link Loop -->
      <rect x="294" y="440" width="300" height="150" rx="75" ry="75" 
            transform="rotate(35 444 515)" 
            fill="none" 
            stroke="url(#droidGreenGrad)" 
            stroke-width="50" 
            stroke-linejoin="round" />
      <rect x="294" y="440" width="300" height="150" rx="75" ry="75" 
            transform="rotate(35 444 515)" 
            fill="none" 
            stroke="url(#droidGleam)" 
            stroke-width="10" 
            opacity="0.45" />

      <!-- Interlock Overlap Crossover -->
      <g clip-path="url(#topWeaveClip)" filter="url(#topWeaveShadow)">
        <rect x="294" y="440" width="300" height="150" rx="75" ry="75" 
              transform="rotate(35 444 515)" 
              fill="none" 
              stroke="url(#droidGreenGrad)" 
              stroke-width="50" />
        <rect x="294" y="440" width="300" height="150" rx="75" ry="75" 
              transform="rotate(35 444 515)" 
              fill="none" 
              stroke="url(#droidGleam)" 
              stroke-width="10" 
              opacity="0.45" />
      </g>

      <!-- Center Spark -->
      <g transform="translate(512 515)">
        <circle cx="0" cy="0" r="32" fill="url(#droidSpark)" opacity="0.9" />
        <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#FFFFFF" />
        <circle cx="0" cy="0" r="4" fill="#00F5D4" />
      </g>

      <!-- Data Dots -->
      <circle cx="430" cy="460" r="5" fill="#70E4FF" />
      <circle cx="480" cy="485" r="4" fill="#FFFFFF" />
      <circle cx="544" cy="545" r="4" fill="#FFFFFF" />
      <circle cx="594" cy="570" r="5" fill="#A4C9FF" />
    </g>

    <!-- Subtle inner highlight ring -->
    <rect x="33" y="33" width="446" height="446" rx="99" ry="99" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" />
  </g>
</svg>