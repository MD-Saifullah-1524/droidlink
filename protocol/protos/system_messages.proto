syntax = "proto3";

package droidlink.protocol;

option java_outer_classname = "SystemProto";

// Connection lifecycle and system control messages
message SystemMessage {
  enum SystemEventType {
    SYS_UNKNOWN = 0;
    HELLO = 1;           // Initial handshake
    HELLO_ACK = 2;       // Handshake acknowledgment
    HEARTBEAT = 3;       // Keep-alive ping
    GOODBYE = 4;         // Graceful disconnect
    SYS_ERROR = 5;       // Error notification
    DEVICE_STATUS = 6;   // Device status & telemetry (battery, network, cellular, SIM)
  }

  SystemEventType event = 1;

  // For HELLO
  HelloMessage hello = 10;

  // For HELLO_ACK
  HelloAckMessage hello_ack = 11;

  // For ERROR / Status telemetry payload
  ErrorMessage error = 12;
}

// Device Status and Telemetry message (serialized in payload or error.details)
message DeviceStatusMessage {
  string device_name = 1;
  string device_model = 2;
  BatteryInfo battery = 3;
  NetworkInfo network = 4;
  CellularInfo cellular = 5;
  repeated SimCardInfo sim_cards = 6;
}

message BatteryInfo {
  int32 percentage = 1;         // 0 - 100
  bool is_charging = 2;
  string power_source = 3;      // "Battery", "AC", "USB", "Wireless"
}

message NetworkInfo {
  string connection_type = 1;   // "Wi-Fi", "Ethernet", "Cellular", "None"
  string wifi_ssid = 2;
  int32 wifi_signal_level = 3;  // 0 - 4
  int32 wifi_rssi = 4;          // dBm
}

message CellularInfo {
  bool has_cellular = 1;
  string carrier_name = 2;      // e.g., "T-Mobile", "Verizon", "Jio"
  string network_type = 3;      // e.g., "5G", "4G LTE"
  int32 signal_level = 4;       // 0 - 4 bars
  int32 signal_dbm = 5;
}

message SimCardInfo {
  int32 slot_index = 1;
  string carrier_name = 2;
  string display_name = 3;
  string state = 4;             // "Ready", "Absent"
}

// Initial handshake message from client
message HelloMessage {
  string protocol_version = 1;      // e.g., "1.0.0"
  string device_id = 2;             // Unique device ID
  string device_name = 3;           // User-friendly name
  DeviceType device_type = 4;       // Android or Mac/iPad
  repeated string supported_features = 5; // Feature list
  string certificate_fingerprint = 6; // For validation
}

// Handshake acknowledgment from server
message HelloAckMessage {
  string protocol_version = 1;
  string device_id = 2;
  string device_name = 3;
  DeviceType device_type = 4;
  repeated string supported_features = 5;
}

// Error notification
message ErrorMessage {
  ErrorCode code = 1;
  string message = 2;
  string details = 3;
}

enum DeviceType {
  DEVICE_UNKNOWN = 0;
  ANDROID = 1;
  MAC = 2;
  IPAD = 3;
  IPHONE = 4;
}

enum ErrorCode {
  ERROR_UNKNOWN = 0;
  CONNECTION_FAILED = 1;
  AUTHENTICATION_FAILED = 2;
  PROTOCOL_MISMATCH = 3;
  FEATURE_NOT_SUPPORTED = 4;
  PERMISSION_DENIED = 5;
  RESOURCE_UNAVAILABLE = 6;
}
